services:
  # Express API — verifies Clerk JWTs independently, calls Claude
  - type: web
    name: twitcher-api
    runtime: node
    plan: starter
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: FRIGATE_INGEST_SECRET
        sync: false
      # Comma-separated. Used for both CORS and the JWT authorizedParties
      # check — value: https://twitcher.yourdomain.com (see README).
      - key: ALLOWED_ORIGINS
        sync: false
      # Used only to build full links in emails — value: https://twitcher.yourdomain.com (no trailing slash)
      - key: APP_URL
        sync: false

  # Next.js frontend — Clerk-gated UI
  - type: web
    name: twitcher-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # value: https://api.yourdomain.com (see README)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
