services:
  # Express API — verifies Clerk JWTs independently, calls Claude
  - type: web
    name: twitcher-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Comma-separated. Used for both CORS and the JWT authorizedParties
      # check — value: https://twitcher.cowell.ca (see README).
      - key: ALLOWED_ORIGINS
        sync: false

  # Next.js frontend — Clerk-gated UI
  - type: web
    name: twitcher-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # value: https://api.cowell.ca (see README)
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
